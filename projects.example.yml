# Pi-Deployer Projects Configuration
#
# Copy this file to projects.yml (gitignored) and edit it:
#   cp projects.example.yml projects.yml
#
# defaults: applied to all projects unless overridden
# projects: list of projects to manage

defaults:
    branch: main
    deploy_mode: docker-compose
    timeout: 300
    health_check:
        enabled: false
        retries: 3
        interval: 5

projects:
    - name: my-dashboard
      repo: your-github-user/my-dashboard
      path: /home/your-user/my-dashboard
      deploy_mode: docker-compose
      # webhook_secret: override-per-project-if-needed
      health_check:
          enabled: true
          url: http://localhost:8080
          retries: 5
          interval: 3

    - name: my-bot
      repo: your-github-user/my-bot
      path: /home/your-user/docker/my-bot
      deploy_mode: docker-compose
      timeout: 600
      health_check:
          enabled: true
          url: http://localhost:3000/health
          initial_delay: 15
          retries: 5
          interval: 3

